packages:
  - web

# Supply-chain guard: never install a version published less than 14 days ago.
minimumReleaseAge: 20160

# Security exception (29 Oct 2026): undici 7.30.1 fixes 4 high + 4 moderate advisories in
# wrangler > miniflare > undici 7.29.1 and was 1 hour short of the 14-day window.
# Exact version only. Safe to delete this exception after 12 Nov 2026.
minimumReleaseAgeExclude:
  - undici@7.30.1

# Force the patched undici; miniflare pins 7.29.1 exactly.
overrides:
  undici@<7.30.1: 7.30.1

# Only these packages may run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true
